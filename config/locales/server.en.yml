en:
  site_settings:
    indexnow_enabled: "Enable IndexNow submissions"
    indexnow_api_key: "IndexNow API key (32 hexadecimal characters)"
    indexnow_submit_on_create: "Submit new topics to IndexNow"
    indexnow_submit_on_edit: "Resubmit edited first posts to IndexNow"
    indexnow_submit_on_reply: "Resubmit a topic to IndexNow when a reply is added. A reply changes the topic page, so search engines have something new to fetch, but on a busy forum this is far more submissions than topic creation alone. Use the topic cooldown setting to control how often one topic may be resubmitted."
    indexnow_topic_cooldown_minutes: "Shortest gap between automatic submissions of the same topic, in minutes. Set to 1440 to submit a topic at most once a day, or 0 to disable the cooldown. Manual submissions, backfills and deletion notices ignore it."
    indexnow_excluded_category_ids: "Categories that should never be submitted to IndexNow"
    indexnow_excluded_tag_names: "Tags whose topics should never be submitted to IndexNow"
    indexnow_hourly_limit: "Maximum URLs submitted to IndexNow per hour"
    indexnow_daily_limit: "Maximum URLs submitted to IndexNow per day"
    errors:
      discourse_index_now_login_required: "IndexNow cannot be enabled while login is required for the whole site."
      discourse_index_now_invalid_api_key: "The IndexNow API key must be 32 lowercase hexadecimal characters."
